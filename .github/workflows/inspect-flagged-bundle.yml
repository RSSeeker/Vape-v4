name: Inspect previously flagged bundle

# One-time, read-only inspection of the exact artifact reported by the user.
# The downloaded files are scanned as data and are never executed.
on:
  push:
    branches:
      - 'arena/5340de08-vape-v421'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    name: Hash and scan previous Windows bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download the previously flagged artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-english-bundle
          run-id: 45586342055
          github-token: ${{ github.token }}
          path: flagged-bundle

      - name: Record sample hashes without executing them
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find flagged-bundle -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0 | sort -z)
          if [ "${#files[@]}" -ne 2 ]; then echo 'Expected one EXE and one DLL.'; exit 1; fi
          sha256sum "${files[@]}" | tee sample-hashes.txt
          while IFS= read -r line; do echo "::notice title=Flagged sample SHA-256::$line"; done < sample-hashes.txt

      - name: Install ClamAV and obtain current signatures
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav
          sudo freshclam --stdout

      - name: Scan the EXE and DLL without running either file
        shell: bash
        run: |
          set -uo pipefail
          clamscan --scan-archive=yes --max-filesize=100M --max-scansize=500M --infected flagged-bundle 2>&1 | tee clamav-report.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo '::notice title=ClamAV result::No ClamAV signatures detected. This does not establish safety.'
          elif [ "$status" -eq 1 ]; then
            echo '::error title=ClamAV result::ClamAV detected at least one signature; see the diagnostic report.'
          else
            echo '::error title=ClamAV result::Scan failed or was incomplete; do not treat it as clean.'
          fi
          exit "$status"

      - name: Upload small diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagged-bundle-inspection
          path: |
            sample-hashes.txt
            clamav-report.txt
          if-no-files-found: warn
          retention-days: 14
