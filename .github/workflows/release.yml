name: Publish tested Soulbound release

# Publish existing artifacts from a completed CI run for the exact tagged commit;
# never rebuild or overwrite an existing release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag, e.g. SoulboundV1 or SoulboundV1.1'
        required: true
        type: string
      run_id:
        description: 'Successful Build and test workflow run ID for that exact commit'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified CI artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Verify tag, source version and complete CI run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/verify_release_version.py --tag "$TAG"
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid run ID'; exit 1; }
          [[ -s "docs/releases/$TAG.md" ]] || { echo 'Missing release notes'; exit 1; }
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml" --jq .id)
          [[ "$(jq -r .workflow_id <<< "$run")" == "$workflow_id" ]] || { echo 'Not the CI workflow'; exit 1; }
          [[ "$(jq -r .head_repository.full_name <<< "$run")" == "$GITHUB_REPOSITORY" ]] || { echo 'Wrong repository'; exit 1; }
          [[ "$(jq -r .head_sha <<< "$run")" == "$(git rev-parse HEAD)" ]] || { echo 'CI did not test this tag commit'; exit 1; }
          [[ "$(jq -r .status <<< "$run")" == completed && "$(jq -r .conclusion <<< "$run")" == success ]] || { echo 'Complete CI, including the scan, must succeed'; exit 1; }
      - name: Download artifacts from that exact run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --name windows-x64-soulbound-bundle --dir bundle
          gh run download "$RUN_ID" --name rebuilt-bundle-scan-report --dir scan
      - name: Verify artifacts and scanned hashes
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/verify_release_version.py --tag "$TAG" \
            --executable "bundle/$TAG.exe" --dll bundle/SoulboundNative.dll \
            --checksums bundle/SHA256SUMS.txt --scan-hashes scan/sample-hashes.txt
          test -s bundle/MODULE-PARITY-REPORT.txt
          test -s scan/clamav-report.txt
      - name: Create release without overwriting assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" "bundle/$TAG.exe" bundle/SoulboundNative.dll \
            bundle/SHA256SUMS.txt bundle/MODULE-PARITY-REPORT.txt \
            scan/clamav-report.txt scan/sample-hashes.txt \
            --verify-tag --title "Soulbound V${TAG#SoulboundV}" \
            --notes-file "docs/releases/$TAG.md"
