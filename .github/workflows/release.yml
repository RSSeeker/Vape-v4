name: 构建并发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: 构建 Vape-v4.21.exe 并发布
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 校验 Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: 配置 JDK 17（编译 Java 载荷）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 JDK 8（原生 JNI/JVMTI 头文件）
        id: setup-jdk8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: 构建 Java 载荷并校验
        shell: pwsh
        run: .\gradlew.bat build verifyInjectionPayload --stacktrace

      - name: 构建 Windows x64 单文件注入包（JDK 8 头文件）
        shell: pwsh
        run: .\gradlew.bat prepareInjectionBundle -PtargetRelease=8 "-PnativeJavaHome=${{ steps.setup-jdk8.outputs.path }}" --stacktrace

      - name: 运行原生组件测试
        shell: pwsh
        run: ctest --test-dir build/native -C Release --output-on-failure

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Vape ${{ github.ref_name }}
          body: |
            加载器：`Vape-v4.21.32.exe`（内嵌 DLL + 图标 + 全部资源）。
            原生库：`Vape-v4.21Native.dll` —— 放在 exe 同目录时优先使用外部 DLL，否则自动解压内嵌 DLL。

            使用：双击打开 GUI 选 Minecraft 进程注入；或命令行 `Vape-v4.21.32.exe -nogui [pid]`。
            详见 CHANGELOG.md。
          files: |
            build/injection/Vape-v4.21*.exe
            build/injection/Vape-v4.21Native.dll
          overwrite: true
          update_release_body: false
          prerelease: ${{ contains(github.ref_name, '-pre') }}
          fail_on_unmatched_files: true
