name: Publish tested InevitableClient release

# A product tag can publish only after a completed CI run for that exact commit.
# Manual dispatch remains available for selecting a specific successful run.
# Both paths publish existing artifacts; neither rebuilds or replaces a release.
on:
  push:
    tags:
      - 'InevitableClientV*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag, e.g. InevitableClientV1 or InevitableClientV1.1'
        required: true
        type: string
      run_id:
        description: 'Successful Build and test workflow run ID for that exact commit'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified CI artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Select and validate tag
        id: release_tag
        env:
          EVENT: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT" == push ]]; then TAG="$PUSH_TAG"; else TAG="$INPUT_TAG"; fi
          [[ "$TAG" =~ ^InevitableClientV[1-9][0-9]*(\.[0-9]+)*$ ]] || { echo 'Invalid product tag'; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release_tag.outputs.tag }}
          persist-credentials: false
      - name: Verify tag, source version and complete CI run
        id: verified_run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
          EVENT: ${{ github.event_name }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/verify_release_version.py --tag "$TAG"
          [[ -s "docs/releases/$TAG.md" ]] || { echo 'Missing release notes'; exit 1; }
          commit=$(git rev-parse HEAD)
          RUN_ID="$INPUT_RUN_ID"
          if [[ "$EVENT" == push ]]; then
            runs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f "head_sha=$commit" -f status=success -F per_page=100)
            RUN_ID=$(jq -r --arg sha "$commit" --arg repo "$GITHUB_REPOSITORY" \
              '[.workflow_runs[] | select(.head_sha == $sha and .head_repository.full_name == $repo and
                .status == "completed" and .conclusion == "success" and
                (.event == "push" or .event == "workflow_dispatch"))] | sort_by(.id) | last | .id // empty' <<< "$runs")
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'No successful CI run for this commit'; exit 1; }
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml" --jq .id)
          [[ "$(jq -r .workflow_id <<< "$run")" == "$workflow_id" ]] || { echo 'Not the CI workflow'; exit 1; }
          [[ "$(jq -r .head_repository.full_name <<< "$run")" == "$GITHUB_REPOSITORY" ]] || { echo 'Wrong repository'; exit 1; }
          [[ "$(jq -r .head_sha <<< "$run")" == "$commit" ]] || { echo 'CI did not test this tag commit'; exit 1; }
          [[ "$(jq -r .event <<< "$run")" == push || "$(jq -r .event <<< "$run")" == workflow_dispatch ]] || { echo 'Unsupported CI event'; exit 1; }
          [[ "$(jq -r .status <<< "$run")" == completed && "$(jq -r .conclusion <<< "$run")" == success ]] || { echo 'Complete CI, including the scan, must succeed'; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Publishing artifacts from successful CI run $RUN_ID for $commit"
      - name: Download artifacts from that exact run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.verified_run.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --name windows-x64-inevitable-bundle --dir bundle
          gh run download "$RUN_ID" --name rebuilt-bundle-scan-report --dir scan
      - name: Verify artifacts and scanned hashes
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/verify_release_version.py --tag "$TAG" \
            --executable "bundle/$TAG.exe" --dll bundle/InevitableClientNative.dll \
            --checksums bundle/SHA256SUMS.txt --scan-hashes scan/sample-hashes.txt
          test -s bundle/MODULE-PARITY-REPORT.txt
          test -s scan/clamav-report.txt
      - name: Create release without overwriting assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" "bundle/$TAG.exe" bundle/InevitableClientNative.dll \
            bundle/SHA256SUMS.txt bundle/MODULE-PARITY-REPORT.txt \
            scan/clamav-report.txt scan/sample-hashes.txt \
            --verify-tag --title "InevitableClientV${TAG#InevitableClientV}" \
            --notes-file "docs/releases/$TAG.md"
