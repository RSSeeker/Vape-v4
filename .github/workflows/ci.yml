name: Build and test

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test the Windows x64 bundle
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Install JDK 8 first so JAVA_HOME points to JDK 17 for Gradle. The JDK 8
      # path is still passed explicitly for JNI/JVMTI headers.
      - name: Install JDK 8 headers
        id: setup-jdk8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install JDK 17 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and verify the Java 8-compatible payload
        shell: pwsh
        run: .\gradlew.bat clean build verifyInjectionPayload -PtargetRelease=8 -PnoObfuscation --stacktrace

      - name: Build the Windows x64 bundle
        shell: pwsh
        run: .\gradlew.bat prepareInjectionBundle -PtargetRelease=8 -PnoObfuscation "-PnativeJavaHome=${{ steps.setup-jdk8.outputs.path }}" --stacktrace

      - name: Run native tests
        shell: pwsh
        run: ctest --test-dir build/native -C Release --output-on-failure

      - name: Upload Java injection payload
        uses: actions/upload-artifact@v4
        with:
          name: java-injection-payload
          path: build/libs/*-injection.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload English Windows x64 bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-english-bundle
          path: build/injection/
          if-no-files-found: error
          retention-days: 14
