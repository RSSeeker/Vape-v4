name: Build and test

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test the Windows x64 bundle
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Install JDK 8 first so JAVA_HOME points to JDK 17 for Gradle. The JDK 8
      # path is still passed explicitly for JNI/JVMTI headers.
      - name: Install JDK 8 headers
        id: setup-jdk8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install JDK 17 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python for parity checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the parity checker
        shell: pwsh
        run: python -B -X utf8 -m unittest discover -s tools/tests -v

      - name: Test rotation math and headless controller lifecycles
        shell: pwsh
        run: |
          $classes = Join-Path $env:RUNNER_TEMP 'rotation-math-tests'
          New-Item -ItemType Directory -Force -Path $classes | Out-Null
          & javac --release 8 -encoding UTF-8 -d $classes src/main/java/gg/vape/rotation/RotationMath.java tools/tests/RotationMathTest.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & java -cp $classes RotationMathTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python -B -X utf8 tools/tests/run_rotation_controller_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test headless combat and Search lifecycles
        shell: pwsh
        run: |
          & python -B -X utf8 tools/tests/run_attack_key_controller_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python -B -X utf8 tools/tests/run_combat_module_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python -B -X utf8 tools/tests/run_automace_module_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python -B -X utf8 tools/tests/run_search_processor_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python -B -X utf8 tools/tests/run_search_block_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python -B -X utf8 tools/tests/run_base_hunting_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python -B -X utf8 tools/tests/run_world_label_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # JDK 17 contains ASM, used only by the offline obfuscation auditor.
      - name: Compile and test the obfuscated-class auditor
        shell: pwsh
        run: |
          $classes = Join-Path $env:RUNNER_TEMP 'module-parity-tools'
          New-Item -ItemType Directory -Force -Path $classes | Out-Null
          $exports = @('--add-exports', 'java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED',
                       '--add-exports', 'java.base/jdk.internal.org.objectweb.asm.commons=ALL-UNNAMED')
          & javac @exports -encoding UTF-8 -d $classes tools/ObfuscatedClassAudit.java tools/tests/ObfuscatedClassAuditTest.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & java @exports -cp $classes ObfuscatedClassAuditTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and verify the Java 8-compatible payload
        shell: pwsh
        run: .\gradlew.bat clean build verifyInjectionPayload -PtargetRelease=8 -PnoObfuscation --stacktrace

      # Preserve the release's randomized class-name packaging; the resulting
      # embedded JAR is separately compared with the un-obfuscated source build.
      - name: Build the Windows x64 bundle
        shell: pwsh
        run: .\gradlew.bat prepareInjectionBundle -PtargetRelease=8 "-PnativeJavaHome=${{ steps.setup-jdk8.outputs.path }}" --stacktrace

      - name: Run native tests
        shell: pwsh
        run: ctest --test-dir build/native -C Release --output-on-failure

      # Rebuild the exact upstream tag's source using the same build script,
      # dependencies and toolchain as the English payload, so class-byte
      # comparisons are not distorted by a different compiler or build flags.
      - name: Check out the pinned 4.21.58 baseline
        uses: actions/checkout@v4
        with:
          ref: 36aa9fb4890b2845de3452f008a334d0d08b774f
          path: build/module-parity-baseline
          persist-credentials: false

      - name: Build the baseline Java payload
        shell: pwsh
        run: |
          Copy-Item -LiteralPath 'build.gradle' -Destination 'build/module-parity-baseline/build.gradle' -Force
          .\gradlew.bat -p build/module-parity-baseline injectionJar -PtargetRelease=8 -PnoObfuscation --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Download only for offline byte inspection, never execute the original.
      # Its hash is checked against the one supplied with the task before use.
      - name: Download and verify the original release EXE
        shell: pwsh
        run: |
          $original = Join-Path $env:RUNNER_TEMP 'Vape-v4.21.58-original.exe'
          $url = 'https://github.com/RSSeeker/Vape-v4/releases/download/v4.21.58/Vape-v4.21.58.exe'
          & curl.exe --silent --show-error --fail --location --retry 3 --retry-delay 3 --connect-timeout 30 --output $original $url
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the original release for parity inspection.' }
          $hash = (Get-FileHash -LiteralPath $original -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '9b77e8ae1bddb6296e5d773d19ecada341fe93ac8ef39559bddcca7a4b945482') {
            throw "Original release SHA-256 mismatch: $hash"
          }
          Write-Output "::notice title=Original release checksum::SHA-256 verified: $hash"

      - name: Audit source, compiled modules, and embedded payload
        shell: pwsh
        run: |
          $baseline = @(Get-ChildItem -Path 'build/module-parity-baseline/build/libs' -Filter '*-injection.jar' -File)
          $current = @(Get-ChildItem -Path 'build/libs' -Filter '*-injection.jar' -File)
          $executables = @(Get-ChildItem -Path 'build/injection' -Filter 'SoulboundV*.exe' -File)
          if ($baseline.Count -ne 1 -or $current.Count -ne 1 -or $executables.Count -ne 1) {
            throw 'Expected exactly one baseline JAR, Soulbound JAR, and Soulbound EXE.'
          }
          python -B -X utf8 tools/verify_module_parity.py `
            --baseline-source 'build/module-parity-baseline' --current-source '.' `
            --baseline-jar $baseline[0].FullName --current-jar $current[0].FullName `
            --embedded-jar 'build/obfuscated-payload/payload.jar' `
            --original-exe (Join-Path $env:RUNNER_TEMP 'Vape-v4.21.58-original.exe') `
            --original-jar-output (Join-Path $env:RUNNER_TEMP 'Vape-original-payload.jar') `
            --current-exe $executables[0].FullName --current-dll 'build/injection/SoulboundNative.dll' `
            --report 'build/injection/MODULE-PARITY-REPORT.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare original and embedded module classes
        shell: pwsh
        run: |
          $classes = Join-Path $env:RUNNER_TEMP 'module-parity-tools'
          $baseline = (Get-ChildItem -Path 'build/module-parity-baseline/build/libs' -Filter '*-injection.jar' -File).FullName
          $current = (Get-ChildItem -Path 'build/libs' -Filter '*-injection.jar' -File).FullName
          $original = Join-Path $env:RUNNER_TEMP 'Vape-original-payload.jar'
          $exports = @('--add-exports', 'java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED',
                       '--add-exports', 'java.base/jdk.internal.org.objectweb.asm.commons=ALL-UNNAMED')
          $ErrorActionPreference = 'Continue'
          $output = @(& java @exports -cp $classes ObfuscatedClassAudit $baseline $current $original 'build/injection/MODULE-PARITY-REPORT.txt' 2>&1)
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($code -ne 0) {
            $detail = ($output | Where-Object { "$_" -match '(Exception|Error)' } | Select-Object -First 1)
            Write-Output "::error title=Normalized release comparison::Parity was not verified. $detail"
            Add-Content -LiteralPath 'build/injection/MODULE-PARITY-REPORT.txt' -Value "`nNormalized original comparison did not pass; see the workflow log."
            exit $code
          }
          $output = @(& java @exports -cp $classes ObfuscatedClassAudit $current $current 'build/obfuscated-payload/payload.jar' 'build/injection/MODULE-PARITY-REPORT.txt' --embedded 2>&1)
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($code -ne 0) {
            $detail = ($output | Where-Object { "$_" -match '(Exception|Error)' } | Select-Object -First 1)
            Write-Output "::error title=Embedded payload comparison::Parity was not verified. $detail"
            Add-Content -LiteralPath 'build/injection/MODULE-PARITY-REPORT.txt' -Value "`nEmbedded payload comparison did not pass; see the workflow log."
            exit $code
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '## Module parity audit'
          Get-Content -LiteralPath 'build/injection/MODULE-PARITY-REPORT.txt' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload parity diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: module-parity-diagnostics
          path: build/injection/MODULE-PARITY-REPORT.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Record bundle checksums
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -Path build/injection -Filter 'SoulboundV*.exe' -File)
          if ($executables.Count -ne 1) { throw "Expected exactly one rebuilt EXE" }
          $dll = Get-Item -LiteralPath 'build/injection/SoulboundNative.dll'
          $checksums = foreach ($file in ($executables + @($dll))) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $checksums | Set-Content -LiteralPath 'build/injection/SHA256SUMS.txt' -Encoding ascii
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '## Rebuilt bundle SHA-256'
          $checksums | ForEach-Object { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- $_" }

      - name: Verify product, bundle and embedded versions agree
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem -Path build/injection -Filter 'SoulboundV*.exe' -File)
          $jar = @(Get-ChildItem -Path build/libs -Filter '*-injection.jar' -File)
          if ($exe.Count -ne 1 -or $jar.Count -ne 1) { throw 'Expected one executable and one source payload.' }
          python -B -X utf8 tools/verify_release_version.py --executable $exe[0].FullName `
            --dll 'build/injection/SoulboundNative.dll' --checksums 'build/injection/SHA256SUMS.txt' `
            --payload $jar[0].FullName --payload 'build/obfuscated-payload/payload.jar'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload un-obfuscated Java source-build payload
        uses: actions/upload-artifact@v4
        with:
          name: java-source-build-payload
          path: build/libs/*-injection.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload Soulbound Windows x64 bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-soulbound-bundle
          path: build/injection/
          if-no-files-found: error
          retention-days: 14

      # Exercise incrementing versions in the same build tree *after* uploading
      # the release candidate. These diagnostic builds must never be published.
      - name: Test incremental 1.1 and 1.2 versioned bundles
        shell: pwsh
        run: |
          foreach ($version in @('1.1', '1.2')) {
            .\gradlew.bat prepareInjectionBundle -PtargetRelease=8 -PnoObfuscation "-PsoulboundVersion=$version" "-PnativeJavaHome=${{ steps.setup-jdk8.outputs.path }}" --stacktrace
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $properties = Join-Path $env:RUNNER_TEMP "soulbound-version-$version.properties"
            "soulboundVersion=$version" | Set-Content -LiteralPath $properties -Encoding ascii
            python -B -X utf8 tools/verify_release_version.py --properties $properties --tag "SoulboundV$version" `
              --payload "build/libs/soulbound-$version-injection.jar" `
              --executable "build/injection/SoulboundV$version.exe" --dll 'build/injection/SoulboundNative.dll'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  scan-bundle:
    name: Scan the rebuilt bundle as data
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download this run's Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-soulbound-bundle
          path: bundle
      - name: Hash and scan without executing the bundle
        shell: bash
        run: |
          set -uo pipefail
          mapfile -d '' files < <(find bundle -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0 | sort -z)
          if [ "${#files[@]}" -ne 2 ]; then echo '::error::Expected one EXE and one DLL.'; exit 1; fi
          sha256sum "${files[@]}" | tee sample-hashes.txt
          while IFS= read -r line; do echo "::notice title=Rebuilt sample SHA-256::$line"; done < sample-hashes.txt
          fail_setup() {
            local status="$1"
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              echo "::warning title=ClamAV setup detail::$line"
            done < <(tail -15 clamav-setup.txt)
            echo '::error::ClamAV setup failed; the bundle has not been scanned.'
            exit "$status"
          }
          sudo apt-get update -qq 2>&1 | tee clamav-setup.txt
          status=${PIPESTATUS[0]}; if [ "$status" -ne 0 ]; then fail_setup "$status"; fi
          sudo apt-get install -y -qq clamav 2>&1 | tee -a clamav-setup.txt
          status=${PIPESTATUS[0]}; if [ "$status" -ne 0 ]; then fail_setup "$status"; fi
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam --stdout 2>&1 | tee -a clamav-setup.txt
          status=${PIPESTATUS[0]}; if [ "$status" -ne 0 ]; then fail_setup "$status"; fi
          clamscan --scan-archive=yes --max-filesize=1024M --max-scansize=2048M --alert-exceeds-max=yes --infected "${files[@]}" 2>&1 | tee clamav-report.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ] && ! awk '/^Scanned files:/ {found=1; if ($3 >= 2) ok=1} END {exit !(found && ok)}' clamav-report.txt; then status=2; fi
          if [ "$status" -eq 0 ]; then
            echo '::notice title=ClamAV result::No signatures detected; this single scan does not establish safety.'
          elif [ "$status" -eq 1 ]; then
            echo '::error title=ClamAV result::A signature was detected; see the report.'
          else
            echo '::error title=ClamAV result::The scan failed or was incomplete.'
          fi
          exit "$status"
      - name: Upload small scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-bundle-scan-report
          path: |
            sample-hashes.txt
            clamav-setup.txt
            clamav-report.txt
          if-no-files-found: warn
          retention-days: 14
